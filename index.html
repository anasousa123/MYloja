<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashion ERP | Login</title>

    <meta name="description" content="Sistema Premium para Gerenciamento de Lojas de Roupas">
    <meta name="theme-color" content="#111827">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/ base.css">
    <link rel="stylesheet" href="css/ layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-page">

    <!-- LADO ESQUERDO -->

    <section class="login-banner">

        <div class="overlay"></div>

        <div class="banner-content">

            <h1>Fashion ERP</h1>

            <p>

                Gerencie sua loja de roupas com um sistema moderno,
                inteligente e elegante.

            </p>

            <div class="banner-cards">

                <div class="mini-card">

                    <i class="fa-solid fa-chart-line"></i>

                    <span>Relatórios Inteligentes</span>

                </div>

                <div class="mini-card">

                    <i class="fa-solid fa-box"></i>

                    <span>Controle de Estoque</span>

                </div>

                <div class="mini-card">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span>Gestão de Vendas</span>

                </div>

            </div>

        </div>

    </section>

    <!-- LADO DIREITO -->

    <section class="login-panel">

        <div class="login-card">

            <div class="logo">

                <i class="fa-solid fa-shirt"></i>

                <h2>Fashion ERP</h2>

            </div>

            <h3>Bem-vinda!</h3>

            <p class="subtitle">

                Faça login para acessar o painel administrativo.

            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label>E-mail</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Senha</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required>

                        <button
                            type="button"
                            id="toggleSenha">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Lembrar-me

                    </label>

                    <a href="#">

                        Esqueci minha senha

                    </a>

                </div>

                <button
                    class="btn-login"
                    type="submit">

                    <i class="fa-solid fa-arrow-right-to-bracket"></i>

                    Entrar

                </button>

            </form>

            <div class="footer">

                <span>

                    © 2026 Fashion ERP

                </span>

            </div>

        </div>

    </section>

</div>

<script src="js/auth.js"></script>

</body>

</html>
